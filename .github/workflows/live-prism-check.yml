name: Verify live Prism Motion design and download filenames
on:
  push:
    branches: [main]
    paths:
      - scripts/live-prism-check.mjs
      - .github/workflows/live-prism-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production UX and protected routes
        run: node scripts/live-prism-check.mjs
