name: Verify real source media downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-download-test.yml
permissions:
  contents: read
jobs:
  test-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download actual YouTube and Instagram media and check response bytes
        run: node scripts/source-download-test.mjs
