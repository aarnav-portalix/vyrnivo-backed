name: Vyrnivo Own Converter Checks
on:
  push:
    branches: [main, feat/vyrnivo-first-party-converter, feat/youtube-licensed-source-pilot, feat/second-licensed-youtube-full-video, feat/automatic-licensed-alternatives, feat/private-converter-speed-progress]
    paths:
      - hosting/converter.mjs
      - hosting/media-engine.mjs
      - hosting/private-api.mjs
      - hosting/media-engine.test.mjs
      - hosting/private-api.test.mjs
      - hosting/commons-discovery.mjs
      - hosting/licensed-youtube.mjs
      - hosting/server.mjs
      - src/App.jsx
      - src/style.css
      - tests/converter-validation.test.mjs
      - tests/commons-discovery.test.mjs
      - scripts/commons-discovery-e2e.mjs
      - scripts/converter-e2e.mjs
      - .github/workflows/converter-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/converter-validation.test.mjs tests/commons-discovery.test.mjs
      - name: Query real Commons catalogue without a token
        run: node scripts/commons-discovery-e2e.mjs
      - name: Install FFmpeg on GitHub's temporary test runner
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: ffmpeg -version
      - name: Real end-to-end MP4 and MP3 conversion test
        timeout-minutes: 4
        run: node scripts/converter-e2e.mjs
