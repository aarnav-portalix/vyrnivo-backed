name: 2026 independent Go YouTube extraction probe
on:
  push:
    branches: [experiment/youtube-engine-showdown-2026]
    paths: [scripts/go-licensed-probe.go, .github/workflows/go-youtube-engine-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - name: Fetch maintained Go library v2.10.7 and check real CC video bytes
        run: |
          mkdir -p /tmp/go-yt
          cp scripts/go-licensed-probe.go /tmp/go-yt/main.go
          cd /tmp/go-yt
          go mod init licensed.ccprobe
          go get github.com/kkdai/youtube/v2@v2.10.7
          timeout 95s go run main.go
