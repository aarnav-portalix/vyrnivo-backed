name: Primary website availability
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check liveness endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 \
            https://vyrnivo-downloads.onrender.com/health -o /tmp/health.json
          node -e "const d=require('/tmp/health.json');if(d.ok!==true)process.exit(1);console.log('Web server responding; downloader configured:',d.downloads)"
      - name: Check homepage responds
        run: curl --fail --silent --show-error --max-time 90 -o /dev/null https://vyrnivo-downloads.onrender.com/
