name: 2026 Browser extension YouTube showdown
on:
  push:
    branches: [experiment/youtube-engine-showdown-2026]
    paths: [scripts/extension-browser-probe.mjs, .github/workflows/youtube-extensions-showdown.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  light-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build the lightweight extension from source and run its tests
        run: |
          git clone --depth 1 https://github.com/drhspfn/yt-stream-downloader.git /tmp/yt-stream-ext
          cd /tmp/yt-stream-ext
          npm ci
          npm run check
          set +e
          npm test > /tmp/yt-stream-unit.log 2>&1
          test_code=$?
          set -e
          grep -E '# pass|# fail|not ok' /tmp/yt-stream-unit.log | tail -10 || true
          echo "EXTENSION_UNIT_RESULT {\"engine\":\"YT Stream Downloader\",\"exitCode\":$test_code}"
          npm run build
          test -f dist/manifest.json
          echo "EXTENSION_BUILD_RESULT {\"engine\":\"YT Stream Downloader\",\"built\":true}"
      - name: Launch actual headless Chrome with extension on licensed YouTube sample
        run: |
          cd /tmp/yt-stream-ext
          npm install --no-save puppeteer-core@latest >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/extension-browser-probe.mjs" ./browser-probe.mjs
          timeout 75s node browser-probe.mjs ./dist
  avi-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Build the actively maintained Avi12 Firefox/Chrome downloader
        run: |
          git clone --depth 1 https://github.com/avi12/youtube-downloader.git /tmp/avi12-ext
          cd /tmp/avi12-ext
          npm install -g pnpm@10
          pnpm install --no-frozen-lockfile
          timeout 180s pnpm build
          echo "EXTENSION_BUILD_RESULT {\"engine\":\"Avi12 YouTube Downloader\",\"built\":true,\"verifiedMedia\":false,\"note\":\"build is not playback verification\"}"
      - name: Try loading Avi12 extension in actual Chrome on CC YouTube video
        run: |
          test -f /tmp/avi12-ext/.output/chrome-mv3/manifest.json
          mkdir -p /tmp/avi-browser-probe
          cd /tmp/avi-browser-probe
          npm init -y >/dev/null
          npm install puppeteer-core@latest >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/extension-browser-probe.mjs" ./probe.mjs
          timeout 90s node probe.mjs /tmp/avi12-ext/.output/chrome-mv3

