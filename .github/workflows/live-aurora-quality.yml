name: Verify live Aurora UI quality and privacy copy
on:
  push:
    branches: [main]
    paths:
      - scripts/live-aurora-quality-check.mjs
      - .github/workflows/live-aurora-quality.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed app and protected services
        run: node scripts/live-aurora-quality-check.mjs
