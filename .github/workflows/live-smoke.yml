name: Vyrnivo live smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-smoke.yml
      - scripts/live-smoke.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live Vyrnivo website and test own-file upload/download
        run: node scripts/live-smoke.mjs
