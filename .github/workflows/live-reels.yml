name: Live Instagram Discovery Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/live-reels.mjs
      - .github/workflows/live-reels.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/live-reels.mjs
