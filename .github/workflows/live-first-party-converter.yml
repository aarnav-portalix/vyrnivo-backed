name: Vyrnivo Production Converter E2E
on:
  push:
    branches: [test/live-first-party-converter]
    paths: [.github/workflows/live-first-party-converter.yml, scripts/probe-live-converter.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify REAL files from deployed Render server
        run: node scripts/probe-live-converter.mjs
