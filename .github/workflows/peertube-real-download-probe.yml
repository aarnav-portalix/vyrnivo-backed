name: PeerTube authorized video media access experiment
on:
  push:
    branches: [experiment/peertube-direct-downloads]
    paths: [scripts/peertube-real-download-probe.mjs, .github/workflows/peertube-real-download-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/peertube-real-download-probe.mjs
