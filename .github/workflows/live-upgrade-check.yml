name: Verify deployed Vyrnivo private API, progress and fast converter
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-upgrade-check.yml
      - scripts/live-upgrade-check.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live security and first-party media bytes
        run: node scripts/live-upgrade-check.mjs
