name: Download quality regression tests
on:
  push:
    branches: [main]
    paths:
      - 'hosting/**'
      - 'Dockerfile*'
      - '.github/workflows/download-quality.yml'
  pull_request:
    paths:
      - 'hosting/**'
      - 'Dockerfile*'
      - '.github/workflows/download-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm FFmpeg and FFprobe are installed
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run format, download, fallback, and worker tests
        run: |
          node --test hosting/audio-formats.test.mjs hosting/webdownloader.test.mjs hosting/downloads.test.mjs hosting/owned-downloader.test.mjs hosting/independent-worker.test.mjs
