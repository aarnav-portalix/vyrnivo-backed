<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Vyrnivo orbital V">
<defs>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b991ff"/><stop offset=".5" stop-color="#8655dc"/><stop offset="1" stop-color="#a67aff"/></linearGradient>
<linearGradient id="v" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fffaff"/><stop offset=".55" stop-color="#f1ddff"/><stop offset="1" stop-color="#b48dff"/></linearGradient>
<linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#8e49ec"/><stop offset=".48" stop-color="#c99cff"/><stop offset="1" stop-color="#a768f8"/></linearGradient>
</defs>
<rect x="4" y="4" width="120" height="120" rx="28" fill="#160e2c" stroke="url(#frame)" stroke-width="2"/>
